name: PR Description

on:
  pull_request:
    types:
      - opened

permissions:
  pull-requests: write

jobs:
  set-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Set PR Description
        uses: actions/github-script@v7
        with:
          script: |
            // Default PR description, applied only when the author left it empty
            if (context.payload.pull_request.body) return;

            const description = [
              '### Description',
              'This PR was created to ...',
              '[Card](link here)',
              '',
              '### Business rules',
              '- N/A',
              '',
              '### How to test',
              '- Step 1',
            ].join('\n');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: description,
            });
