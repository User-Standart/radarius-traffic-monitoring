spring:
  application:
    name: radarius
  datasource:
    url: jdbc:postgresql://localhost:5432/radarius
    username: appdb
    password: appdb
    driver-class-name: org.postgresql.Driver
  security:
    user:
      name: appdb
      password: appdb

cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,PATCH,DELETE

security:
  jwt:
    secret-key: radarius
